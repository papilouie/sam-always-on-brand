name: Bug report
description: Report a reproducible SAM behavior or packaging problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: request
    attributes:
      label: User request
      description: Remove all private or client information.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, client data, private links, and unpublished assets.
          required: true
