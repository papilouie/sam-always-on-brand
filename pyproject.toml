[project]
name = "sam-aobpg-tools"
version = "1.0.0"
description = "Validation and packaging tools for SAM Brand Packs and Campaign Packs"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--basetemp=.pytest-tmp"]
